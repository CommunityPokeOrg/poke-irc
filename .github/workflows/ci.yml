name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-package:
    name: IRCKit tests (SwiftPM)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  build-apps:
    name: Build apps (iOS + macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS app (Simulator)
        run: |
          xcodebuild -project PokeIRC.xcodeproj -scheme PokeIRC \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData build CODE_SIGNING_ALLOWED=NO
      - name: Build macOS app
        run: |
          xcodebuild -project PokeIRC.xcodeproj -scheme PokeIRCMac \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData build CODE_SIGNING_ALLOWED=NO

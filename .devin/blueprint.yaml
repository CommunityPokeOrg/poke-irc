initialize: |
  # IRCKit is dependency-free Swift; nothing to install on Linux.
  true
maintenance: |
  # Resolve package deps (currently none) so sources are ready.
  swift package resolve
knowledge:
  - name: test
    contents: |
      swift test          # IRCKit tests (parser, caps, SASL, reconnect, state)
  - name: build
    contents: |
      swift build         # IRCKit only; the SwiftUI app needs Xcode on macOS
---
runs-on: macos
initialize: |
  # XcodeGen regenerates PokeIRC.xcodeproj from project.yml.
  brew install xcodegen
maintenance: |
  xcodegen generate
knowledge:
  - name: test
    contents: |
      swift test
  - name: build
    contents: |
      xcodebuild -project PokeIRC.xcodeproj -scheme PokeIRC -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      xcodebuild -project PokeIRC.xcodeproj -scheme PokeIRCMac -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO
